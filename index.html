<!DOCTYPE html>
<html>
<head>
    <title> Image Guesser </title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Delius+Swash+Caps&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Delius+Swash+Caps&family=Titan+One&display=swap" rel="stylesheet">
</head>

<body>
    <div id="fullBody">
        <div id="titleArea">
            <h1>Who am I?</h1> 
            <p>You have 3 tries to guess which celebrity is in the picture!</p>
        </div>
        <img id="mysteryImage" src="Taylor swift.jpg" alt="Mystery picture">
        <div id="inputArea">
            <input type="text" id="guessInput" placeholder="Enter your guess">
            <button id = "enterButton"> Enter </button>
        </div>
        <p id="guessCount">Guesses left: 999</p>
        <p id="result"></p>
        <p id="celebrityAnswer"></p>
        <script src="script.js"></script>
    </div>
</body>


</html>
